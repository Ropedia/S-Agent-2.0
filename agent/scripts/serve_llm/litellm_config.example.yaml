model_list:
  # Public model name used by clients. Keep this entry as a fallback for
  # requests without a sticky routing key.
  - model_name: "GLM-5.1-FP8"
    litellm_params:
      model: "openai/GLM-5.1-FP8"
      api_base: "https://your-openai-compatible-endpoint.example.com/v1"
      api_key: "your-upstream-api-key"
      input_cost_per_token: 0.0000021
      output_cost_per_token: 0.0000084

  # Backend-specific aliases used by trajectory_logger.py sticky routing.
  # serve_litellm.sh injects a default LITELLM_STICKY_ROUTING_ALIASES value for
  # GLM-5.1-FP8 when CONFIG_NAME=litellm_config. Keep the aliases below in sync
  # with that default, or override LITELLM_STICKY_ROUTING_ALIASES from the shell.
  #
  # Each alias should point at a distinct upstream deployment when possible.
  - model_name: "GLM-5.1-FP8@llm"
    litellm_params:
      model: "openai/GLM-5.1-FP8"
      api_base: "https://your-openai-compatible-endpoint-llm.example.com/v1"
      api_key: "your-upstream-api-key"
      input_cost_per_token: 0.0000021
      output_cost_per_token: 0.0000084

