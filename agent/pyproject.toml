[project]
name = "sagent"
version = "0.3.0"
description = "A framework for evaluating and optimizing agents and models using sandboxed environments."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alex Shaw", email = "alexgshaw64@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.7",
    "shortuuid>=1.0.13",
    "typer>=0.16.0",
    "requests>=2.32.4",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
    "toml>=0.10.2",
    "tenacity>=9.1.2",
    "python-dotenv>=1.1.1",
    "litellm>=1.80.8",
    "jinja2>=3.1.6",
    "datasets>=4.4.1",
    "dirhash>=0.5.0",
    "claude-agent-sdk>=0.1.17",
    "packaging>=25.0",
    "fastapi>=0.128.0",
    "uvicorn>=0.38.0",
    "ruff>=0.13.0",
    "pathspec>=1.0.3",
    "supabase>=2.28.2",
]

[project.scripts]
sagent = "sagent.cli.main:app"
hr = "sagent.cli.main:app"
hb = "sagent.cli.main:app"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"


[project.optional-dependencies]
# ---------------------------------------------------------------------------
#
#
#   uv pip install -e ".[spatial]"
#
spatial = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pyarrow>=18.0",
    "pandas>=2.2",
    "msgpack>=1.1",
    "orjson>=3.10",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]
e2b = ["e2b>=2.4.2", "dockerfile-parse>=2.0.1"]
daytona = ["daytona>=0.121.0"]
modal = ["modal>=1.4.0"]
runloop = ["runloop-api-client>=1.2.0"]
gke = ["kubernetes>=32.0.0"]
cloud = ["sagent[e2b]", "sagent[daytona]", "sagent[modal]", "sagent[runloop]", "sagent[gke]"]
all = ["sagent[cloud]", "sagent[tinker]"]
tinker = [
    "tinker>=0.14.0",
    "tinker-cookbook>=0.1.0",
]

[dependency-groups]
dev = [
    "sagent[cloud]",
    "ipykernel>=6.30.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
    "ty>=0.0.19",
]

[tool.ruff.lint.isort]
known-first-party = ["sagent"]

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src/sagent"]
exclude = ["src/sagent/cli/template-adapter", "src/sagent/cli/template-task", "src/sagent/agents/installed/openhands_sdk_runner.py", "src/sagent/agents/custom/openhands_sdk_runner.py"]
